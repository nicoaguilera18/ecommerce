<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>
  (function () {
    try {
      var stored = localStorage.getItem('nicommerce_theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catálogo en grid · NiCommerce</title>
<meta name="description" content="Listado completo de productos NiCommerce en formato de tarjetas, con filtros por categoría, orden y buscador." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header id="site-header"></header>

<main>
  <section class="section">
    <div class="container">
      <div class="breadcrumb">
        <a href="index.html">Inicio</a><span>/</span><span>Catálogo (grid)</span>
      </div>

      <div class="section__header">
        <div>
          <h1>Catálogo completo</h1>
          <p>Todos los productos de NiCommerce en formato de tarjetas, con imagen, rating y precio destacado.</p>
        </div>
        <div class="view-toggle" role="group" aria-label="Cambiar tipo de vista">
          <a href="listado_tabla.html" title="Vista tabla" aria-label="Vista tabla">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14h18M9 4v16"/></svg>
          </a>
          <a href="listado_box.html" class="is-active" title="Vista grid" aria-label="Vista grid">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </a>
        </div>
      </div>

      <div class="filters-bar">
        <input type="search" id="search-input" placeholder="Buscar producto…" aria-label="Buscar producto" />
        <select id="category-filter" aria-label="Filtrar por categoría">
          <option value="todas">Todas las categorías</option>
        </select>
        <select id="sort-select" aria-label="Ordenar por">
          <option value="relevancia">Relevancia</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
          <option value="rating-desc">Mejor valorados</option>
        </select>
        <span class="filters-bar__count" id="results-count"></span>
      </div>

      <div class="product-grid" id="box-results"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/pages/listadoBox.js"></script>
</body>
</html>
